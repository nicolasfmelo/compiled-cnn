[project]
name = "yolov10-webcam"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics",
    "torch",
    "torchvision",
    "opencv-python",
    "nvidia-ml-py",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
