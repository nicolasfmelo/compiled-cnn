[project]
name = "compiled-cnn"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics",
    "torch",
    "torchvision",
    "opencv-python",
    "nvidia-ml-py",
    "nvidia-cuda-cccl-cu12==12.8.90",
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "onnxruntime>=1.31.1",
    "openvino>=2026.4.1",
    "nncf>=3.4.0",
    "pycocotools>=2.0.11",
    "pnnx==20261020",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
